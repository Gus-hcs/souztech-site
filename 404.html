<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Página não encontrada — SouZ Controle de Obra</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#05100E" />
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'none'; object-src 'none'; base-uri 'self'; upgrade-insecure-requests" />
<link rel="preload" href="fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin />
<style>
  /* fontes no próprio site (OFL): Archivo variável 400–800 e IBM Plex Mono,
     só o subconjunto latino — sem a folha do Google bloqueando o desenho */
  @font-face { font-family: 'Archivo'; font-style: normal; font-weight: 400 800; font-display: swap;
    src: url(fonts/archivo-latin.woff2) format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: 'IBM Plex Mono'; font-style: normal; font-weight: 400; font-display: swap;
    src: url(fonts/ibm-plex-mono-400-latin.woff2) format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: 'IBM Plex Mono'; font-style: normal; font-weight: 500; font-display: swap;
    src: url(fonts/ibm-plex-mono-500-latin.woff2) format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }

  :root{ --preto:#05100E; --ciano-claro:#2FD4C4; --nevoa:#E8E8E8; --cinza:#ADADAD; --grid:rgba(47,212,196,.08); }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100svh;background:var(--preto);color:var(--nevoa);
    font-family:'Archivo',Arial,sans-serif;display:flex;align-items:center;justify-content:center;
    text-align:center;padding:24px;position:relative;overflow:hidden;
  }
  svg.malha{position:absolute;inset:0;opacity:.7}
  .miolo{position:relative;z-index:1;max-width:440px}
  .cod{font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.2em;color:var(--ciano-claro);text-transform:uppercase}
  h1{font-size:clamp(28px,5vw,40px);font-weight:800;letter-spacing:-0.02em;margin:14px 0 10px}
  p{color:var(--cinza);font-size:15.5px;line-height:1.6;margin:0 0 28px}
  a.btn{display:inline-flex;padding:13px 22px;border-radius:8px;background:#0B7D72;color:#FBFCFB;font-weight:600;font-size:15px;text-decoration:none}
  a.btn:hover{background:var(--ciano-claro);color:#05100e}
</style>
</head>
<body>
  <svg class="malha" width="100%" height="100%" aria-hidden="true">
    <defs><pattern id="m" width="52" height="60" patternUnits="userSpaceOnUse"><path d="M0 60 L52 30 M0 0 L52 30 M26 -15 L26 75" stroke="var(--grid)" stroke-width="1" fill="none"/></pattern></defs>
    <rect width="100%" height="100%" fill="url(#m)"/>
  </svg>
  <div class="miolo">
    <span class="cod">Erro 404</span>
    <h1>Essa página não existe</h1>
    <p>O endereço mudou ou nunca existiu. Volte para a página inicial do Souz Controle de Obra.</p>
    <a class="btn" href="/">Voltar ao início</a>
  </div>
</body>
</html>
